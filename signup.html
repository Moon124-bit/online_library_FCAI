<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Online Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header>
    <div class="box_1">
      <img src="images/logo.jpeg" alt="Logo Image" style="width:7%; height:auto;">
      <div>
        <h1>PAPER  ROOM  /  Online library</h1>  
        <p>Your next favorite book is waiting</p>
      </div>
    </div>
  </header>
<div class="box_2">
  <main>
    <h1>Create Account</h1>
    <p>Fields marked with * are required.</p>

    <form>
      <label for="name">Full name *</label>
      <input type="text" id="name" required>

      <label for="email">Email *</label>
      <input type="email" id="email" required>

      <label for="password">Password *</label>
      <input type="password" id="password" required>

      <label for="confirm">Confirm password *</label>
      <input type="password" id="confirm" required>

      <p>Account type *</p>
      <input type="radio" id="user" name="role" value="user" checked>
      <label for="user">User</label>
      <input type="radio" id="admin" name="role" value="admin">
      <label for="admin">Admin</label>

      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </main></div>

  <footer>
    <p>Online Library - Web Technology Phase 1</p>
  </footer>

</body>
</html>
